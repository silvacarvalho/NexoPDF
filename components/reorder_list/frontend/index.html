<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: "Source Sans Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: transparent;
  }
  #root { display: flex; flex-direction: column; gap: 8px; padding: 2px 2px 8px 2px; }

  .card {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    border-radius: 12px;
    border: 1px solid var(--border, rgba(120,120,120,0.28));
    background: var(--bg, rgba(120,120,120,0.06));
    cursor: grab;
    user-select: none;
    transition: opacity 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
  }
  .card:active { cursor: grabbing; }
  .card.dragging { opacity: 0.35; }
  .card.drag-over {
    border-color: var(--accent, #6366f1);
    box-shadow: 0 0 0 2px var(--accent-soft, rgba(99,102,241,0.30));
  }

  .badge {
    flex: 0 0 auto;
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 22px; height: 22px; padding: 0 6px;
    border-radius: 999px;
    background: var(--accent-soft, rgba(99,102,241,0.15));
    color: var(--accent, #6366f1);
    font-size: 12px; font-weight: 700;
  }
  .icon { flex: 0 0 auto; font-size: 17px; line-height: 1; }
  .text { flex: 1 1 auto; min-width: 0; display: flex; align-items: baseline; gap: 8px; }
  .title {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 0.92rem; color: var(--text, inherit);
  }
  .subtitle {
    flex: 0 0 auto;
    font-size: 0.78rem; opacity: 0.62; white-space: nowrap;
    color: var(--text, inherit);
  }
  .handle { flex: 0 0 auto; opacity: 0.4; font-size: 15px; letter-spacing: -1px; }

  .empty {
    padding: 14px; text-align: center; font-size: 0.85rem; opacity: 0.6;
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  var currentItems = [];
  var dragIndex = null;

  function post(msg) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true }, msg), "*");
  }

  function setFrameHeight() {
    post({ type: "streamlit:setFrameHeight", height: document.documentElement.scrollHeight });
  }

  function sendValue(ids) {
    post({ type: "streamlit:setComponentValue", value: ids, dataType: "json" });
  }

  function escapeHtml(str) {
    var div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
  }

  function applyTheme(theme) {
    if (!theme) return;
    var root = document.documentElement;
    root.style.setProperty("--text", theme.textColor || "inherit");
    root.style.setProperty("--accent", theme.primaryColor || "#6366f1");
    var isDark = (theme.base === "dark");
    root.style.setProperty("--border", isDark ? "rgba(250,250,250,0.18)" : "rgba(49,51,63,0.18)");
    root.style.setProperty("--bg", isDark ? "rgba(250,250,250,0.06)" : "rgba(49,51,63,0.045)");
    // accent-soft: aproxima a cor de destaque com baixa opacidade
    root.style.setProperty("--accent-soft", hexToRgba(theme.primaryColor, 0.16) || "rgba(99,102,241,0.16)");
  }

  function hexToRgba(hex, alpha) {
    if (!hex) return null;
    var m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    if (!m) return null;
    var r = parseInt(m[1], 16), g = parseInt(m[2], 16), b = parseInt(m[3], 16);
    return "rgba(" + r + "," + g + "," + b + "," + alpha + ")";
  }

  function render(items) {
    currentItems = items || [];
    var root = document.getElementById("root");
    root.innerHTML = "";

    if (currentItems.length === 0) {
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Nenhum arquivo enviado.";
      root.appendChild(empty);
      setFrameHeight();
      return;
    }

    currentItems.forEach(function (item, idx) {
      var card = document.createElement("div");
      card.className = "card";
      card.draggable = true;
      card.dataset.index = String(idx);

      card.innerHTML =
        '<span class="badge">' + (idx + 1) + '</span>' +
        '<span class="icon">' + (item.icon || "📄") + '</span>' +
        '<span class="text">' +
          '<span class="title">' + escapeHtml(item.title) + '</span>' +
          '<span class="subtitle">' + escapeHtml(item.subtitle || "") + '</span>' +
        '</span>' +
        '<span class="handle">⠿</span>';

      card.addEventListener("dragstart", function (e) {
        dragIndex = idx;
        card.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
        try { e.dataTransfer.setData("text/plain", String(idx)); } catch (err) {}
      });

      card.addEventListener("dragend", function () {
        card.classList.remove("dragging");
        Array.prototype.forEach.call(
          root.querySelectorAll(".card"),
          function (c) { c.classList.remove("drag-over"); }
        );
        dragIndex = null;
      });

      card.addEventListener("dragover", function (e) {
        if (dragIndex === null) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        card.classList.add("drag-over");
      });

      card.addEventListener("dragleave", function () {
        card.classList.remove("drag-over");
      });

      card.addEventListener("drop", function (e) {
        e.preventDefault();
        card.classList.remove("drag-over");
        var fromIndex = dragIndex;
        var toIndex = idx;
        dragIndex = null;
        if (fromIndex === null || fromIndex === toIndex) return;

        var newItems = currentItems.slice();
        var moved = newItems.splice(fromIndex, 1)[0];
        newItems.splice(toIndex, 0, moved);
        render(newItems);
        sendValue(newItems.map(function (it) { return it.id; }));
      });

      root.appendChild(card);
    });

    setFrameHeight();
  }

  window.addEventListener("message", function (event) {
    var data = event.data;
    if (!data || data.type !== "streamlit:render") return;
    applyTheme(data.theme);
    render((data.args && data.args.items) || []);
  });

  post({ type: "streamlit:componentReady", apiVersion: 1 });
  setFrameHeight();
})();
</script>
</body>
</html>
